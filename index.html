<!DOCTYPE html><html lang="si"><head>    <meta charset="UTF-8">    <meta name="viewport" content="width=device-width, initial-scale=1.0">    <title>පාලි - සිංහල ශබ්දකෝෂය</title>    <style>        :root {            --primary-color: #8B0000;            --secondary-color: #FF8C00;            --bg-color: #FFF8DC;            --card-bg: #FFFFFF;            --text-color: #333333;            --border-color: #DEB887;        }        body {            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, 'Iskoola Pota';            background-color: var(--bg-color);            color: var(--text-color);            margin: 0;            padding: 20px;            display: flex;            flex-direction: column;            align-items: center;        }        .container {            width: 100%;            max-width: 800px;            background: var(--card-bg);            padding: 30px;            border-radius: 15px;            box-shadow: 0 4px 15px rgba(0,0,0,0.1);            border-top: 8px solid var(--primary-color);        }        h1 {            color: var(--primary-color);            text-align: center;            margin-bottom: 25px;            font-size: 28px;        }        .search-box-container {            position: relative;            display: flex;            gap: 10px;            margin-bottom: 5px;        }        .search-input {            flex: 1;            padding: 12px 20px;            font-size: 16px;            border: 2px solid var(--border-color);            border-radius: 30px;            outline: none;        }        .search-input:focus {            border-color: var(--primary-color);        }        .search-btn {            background-color: var(--primary-color);            color: white;            border: none;            border-radius: 50%;            width: 48px;            height: 48px;            cursor: pointer;            display: flex;            align-items: center;            justify-content: center;        }        .suggestions-box {            position: absolute;            top: 100%;            left: 0;            right: 58px;            background: white;            border: 1px solid #ccc;            border-radius: 0 0 15px 15px;            max-height: 250px;            overflow-y: auto;            z-index: 1000;            display: none;        }        .suggestion-item {            padding: 10px 20px;            cursor: pointer;            border-bottom: 1px solid #eee;        }        .suggestion-item:hover {            background-color: #fff8e7;            color: var(--primary-color);            font-weight: bold;        }        .results-container {            margin-top: 30px;        }        .word-card {            background: #fffdf9;            border-left: 5px solid var(--secondary-color);            padding: 20px;            margin-bottom: 15px;            border-radius: 0 8px 8px 0;            box-shadow: 0 2px 5px rgba(0,0,0,0.05);        }        .main-word-title {            font-size: 24px;            font-weight: bold;            color: var(--primary-color);            margin-bottom: 15px;            border-bottom: 2px solid #f5deb3;            padding-bottom: 5px;        }        .meaning-row {            padding: 10px 0;            border-bottom: 1px dashed #eee;            display: flex;            flex-direction: column;            gap: 5px;        }        .meaning-row:last-child {            border-bottom: none;        }        .word-header {            display: flex;            align-items: center;            gap: 10px;        }        .word-type {            background-color: #ffe4b5;            color: #b8860b;            padding: 2px 10px;            border-radius: 20px;            font-size: 13px;            font-weight: bold;            display: inline-block;        }        .meaning-text {            font-size: 16px;            color: #444;            padding-left: 5px;            line-height: 1.5;        }        .no-results {            text-align: center;            color: #d9534f;            padding: 20px;            font-style: italic;            font-weight: bold;        }    </style></head><body><div class="container">    <h1>පාලි - සිංහල ශබ්දකෝෂය</h1>    <div style="position: relative;">        <div class="search-box-container">            <input type="text" id="searchInput" class="search-input" placeholder="දත්ත පූරණය වෙමින් පවතී..." autocomplete="off" disabled>            <button id="searchBtn" class="search-btn" title="සොයන්න" disabled>                <svg viewBox="0 0 24 24" width="20" height="20" fill="white"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>            </button>        </div>        <div id="suggestionsBox" class="suggestions-box"></div>    </div>    <div id="resultsContainer" class="results-container">        <div id="initialMessage" class="no-results" style="color: #555;">සෙවීම් සිදු කිරීම සඳහා දත්ත පූරණය වන තෙක් සිටින්න...</div>    </div></div><script>    let dictionaryData = [];        // PWA සඳහා සාපේක්ෂ Path එක සහ Android සඳහා නිවැරදි Path එක    const PWA_CSV_PATH = "dictionary.csv";    const ANDROID_CSV_PATH = "file:///android_asset/htmlapp/root/dictionary.csv";     const searchInput = document.getElementById('searchInput');    const searchBtn = document.getElementById('searchBtn');    const suggestionsBox = document.getElementById('suggestionsBox');    const resultsContainer = document.getElementById('resultsContainer');    const initialMessage = document.getElementById('initialMessage');    window.addEventListener('DOMContentLoaded', () => {        // පළමුව PWA/Web මාදිලියෙන් (Relative Path) කියවීමට උත්සාහ කරයි        loadCSV(PWA_CSV_PATH, (success) => {            if (!success) {                // එය අසාර්ථක වුවහොත්, Android Local Asset Path එකෙන් උත්සාහ කරයි                loadCSV(ANDROID_CSV_PATH, (finalSuccess) => {                    if (!finalSuccess) showError();                });            }        });    });    // CSV ගොනුව කියවීමේ පොදු ශ්‍රිතය (XHR)    function loadCSV(path, callback) {        const xhr = new XMLHttpRequest();        xhr.open("GET", path, true);        xhr.onload = function () {            if (xhr.status === 200 || xhr.status === 0) {                dictionaryData = parseCSV(xhr.responseText);                if (dictionaryData.length > 0) {                    searchInput.disabled = false;                    searchBtn.disabled = false;                    searchInput.placeholder = "පාලි හෝ සිංහල වචනයක් ටයිප් කරන්න...";                    initialMessage.innerText = "පාලි හෝ සිංහල වචනයක් ඇතුළත් කර සොයන්න.";                    callback(true);                } else {                    callback(false);                }            } else {                callback(false);            }        };        xhr.onerror = function () {            callback(false);        };        xhr.send();    }    function showError() {        initialMessage.innerText = "දත්ත නොමැත (ශබ්දකෝෂ දත්ත ගොනුව සොයාගත නොහැක)";        initialMessage.style.color = "#d9534f";    }    // දත්ත කියවීමේදී සහ ගබඩා කිරීමේදී පාලි වචන වල ඇති ඉලක්කම් ඉවත් කිරීම    function parseCSV(text) {        const lines = text.split(/\r?\n/);        const result = [];                for (let i = 0; i < lines.length; i++) {            const line = lines[i].trim();            if (!line) continue;                        let parts = line.split('\t');            if (parts.length < 3) parts = line.split(',');                        if (parts.length >= 4) {                let rawWord = parts[1] ? parts[1].trim() : '';                // පාලි වචනයෙන් සියලුම ඉලක්කම් (0-9) ඉවත් කිරීම                let cleanedWord = rawWord.replace(/[0-9]/g, '').trim();                 result.push({                    id: parts[0] ? parts[0].trim() : '',                    word: cleanedWord,                    type: parts[2] ? parts[2].trim() : '',                    meaning: parts[3] ? parts[3].trim() : ''                });            }        }        return result;    }    // සෙවුම් යෝජනා (Suggestions) සඳහා වන Debounce තාක්ෂණය    let searchTimeout;    searchInput.addEventListener('input', function() {        clearTimeout(searchTimeout);        const rawQuery = this.value.trim().toLowerCase();        // පරිශීලකයා ඇතුළත් කරන අගයෙන්ද ඉලක්කම් ඉවත් කරයි        const query = rawQuery.replace(/[0-9]/g, '').trim();                suggestionsBox.innerHTML = "";        if (query.length < 1) {            suggestionsBox.style.display = "none";            return;        }                searchTimeout = setTimeout(() => {            const startsWithMatches = []; // ටයිප් කළ අකුරෙන්ම පටන් ගන්නා වචන            const containsMatches = [];   // ටයිප් කළ අකුරු මැදින් ඇති වචන            const meaningMatches = [];    // තේරුම් වලට ගැලපෙන වචන            for (let i = 0; i < dictionaryData.length; i++) {                const item = dictionaryData[i];                const itemWordLower = item.word.toLowerCase();                const itemMeaningLower = item.meaning.toLowerCase();                if (itemWordLower.startsWith(query)) {                    startsWithMatches.push(item.word);                } else if (itemWordLower.includes(query)) {                    containsMatches.push(item.word);                } else if (itemMeaningLower.includes(query)) {                    containsMatches.push(item.word);                }            }            // 'අ' අකුරේ සිරවීම වැළැක්වීම සඳහා මුලින්ම ගැලපෙන වචන (StartsWith) පෙළගස්වයි            const combinedMatches = [...new Set([...startsWithMatches, ...containsMatches, ...meaningMatches])];            const finalMatches = combinedMatches.slice(0, 12); // උපරිම යෝජනා 12ක්            if (finalMatches.length > 0) {                finalMatches.forEach(word => {                    const div = document.createElement('div');                    div.className = 'suggestion-item';                    div.innerText = word;                    div.addEventListener('click', function() {                        searchInput.value = word;                        suggestionsBox.style.display = "none";                        performSearch(word);                    });                    suggestionsBox.appendChild(div);                });                suggestionsBox.style.display = "block";            } else {                suggestionsBox.style.display = "none";            }        }, 150);    });    document.addEventListener('click', function(e) {        if (e.target !== searchInput && e.target !== suggestionsBox) suggestionsBox.style.display = "none";    });    searchBtn.addEventListener('click', () => performSearch(searchInput.value.trim()));    searchInput.addEventListener('keypress', function(e) {        if (e.key === 'Enter') {            suggestionsBox.style.display = "none";            performSearch(this.value.trim());        }    });    function performSearch(query) {        if (!query) return;        const lowerQuery = query.toLowerCase().replace(/[0-9]/g, '').trim();        const filtered = [];                for(let i = 0; i < dictionaryData.length; i++) {            const item = dictionaryData[i];            if (item.word.toLowerCase().includes(lowerQuery) || item.meaning.toLowerCase().includes(lowerQuery)) {                filtered.push(item);            }        }                const grouped = {};        filtered.forEach(item => {            if (!grouped[item.word]) grouped[item.word] = [];            grouped[item.word].push(item);        });        displayResults(grouped);    }    function displayResults(groupedData) {        resultsContainer.innerHTML = "";        const keys = Object.keys(groupedData);        if (keys.length === 0) {            resultsContainer.innerHTML = '<div class="no-results">ගැලපෙන වචන කිසිවක් හමු නොවීය.</div>';            return;        }                keys.forEach(word => {            const items = groupedData[word];            const card = document.createElement('div');            card.className = 'word-card';                        const title = document.createElement('div');            title.className = 'main-word-title';            title.innerText = word;            card.appendChild(title);            items.forEach(item => {                const row = document.createElement('div');                row.className = 'meaning-row';                                let typeHtml = item.type ? `<span class="word-type">${item.type}</span>` : '';                                row.innerHTML = `                    <div class="word-header">                        ${typeHtml}                    </div>                    <div class="meaning-text">${item.meaning}</div>                `;                card.appendChild(row);            });            resultsContainer.appendChild(card);        });    }</script></body></html>
